version: '3.8'

services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - FIREBASE_PROJECT_ID=agentplatform-6cfd7
      - JWT_SECRET=changeinprodlater
      - JWT_EXPIRATION_HOURS=24
    restart: unless-stopped

  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - AUTH_SERVICE_URL=http://auth-service:8082
      - GCP_PROJECT_ID=agentplatform-464918
      - SPANNER_INSTANCE=agentplatform
      - SPANNER_DATABASE=agentplatform
      - GCS_BUCKET=agentplatfrom
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/service-account.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/tmp/keys/service-account.json
    depends_on:
      - auth-service
    restart: unless-stopped

  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
      - VITE_AUTH_API_URL=http://localhost:8082
      - VITE_BACKEND_API_URL=http://localhost:8081
    depends_on:
      - backend-service
    restart: unless-stopped
